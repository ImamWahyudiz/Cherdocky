<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius:12px;">
  <defs>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="25" y="25" width="240" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="25" y="25" width="240" height="6" rx="3" fill="url(#step1)" />
    <rect x="40" y="45" width="60" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" />
    <text x="70" y="59" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">TAHAP 1</text>
    <text x="40" y="85" fill="#f8fafc" font-size="14" font-weight="700">Rasterisasi Dokumen</text>
    <text x="40" y="110" fill="#94a3b8" font-size="11.5">• Ingestion PDF / Gambar</text>
    <text x="40" y="128" fill="#94a3b8" font-size="11.5">• Off-screen 2D Canvas</text>
    <text x="40" y="146" fill="#94a3b8" font-size="11.5">• Flat Pixel Resolution</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 275 100 L 305 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="315" y="25" width="250" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="315" y="25" width="250" height="6" rx="3" fill="url(#step2)" />
    <rect x="330" y="45" width="60" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="360" y="59" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">TAHAP 2</text>
    <text x="330" y="85" fill="#f8fafc" font-size="14" font-weight="700">Deteksi &amp; Penimpaan Pixel</text>
    <text x="330" y="110" fill="#94a3b8" font-size="11.5">• OCR Spatial + Face AI</text>
    <text x="330" y="128" fill="#94a3b8" font-size="11.5">• Hard ctx.fillRect (RGB 0,0,0)</text>
    <text x="330" y="146" fill="#94a3b8" font-size="11.5">• Byte memori asli dihapus</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 575 100 L 605 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="615" y="25" width="240" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="615" y="25" width="240" height="6" rx="3" fill="url(#step3)" />
    <rect x="630" y="45" width="60" height="20" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="660" y="59" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">TAHAP 3</text>
    <text x="630" y="85" fill="#f8fafc" font-size="14" font-weight="700">Penyusunan &amp; Ekspor</text>
    <text x="630" y="110" fill="#94a3b8" font-size="11.5">• Flat Image-Only PDF</text>
    <text x="630" y="128" fill="#94a3b8" font-size="11.5">• Pembersihan EXIF / Meta</text>
    <text x="630" y="146" fill="#94a3b8" font-size="11.5">• Zero Text Ghost Layer</text>
  </g>
</svg>
