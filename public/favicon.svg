<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Base Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <linearGradient id="shieldFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <linearGradient id="redactGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base Icon Surface -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Main Shield Emblem (Background Security Layer) -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Glow Path -->
    <path d="M 256 68 
             C 340 68, 410 88, 410 88 
             V 230 
             C 410 336, 326 408, 256 444 
             C 186 408, 102 336, 102 230 
             V 88 
             C 102 88, 172 68, 256 68 Z" 
          fill="url(#shieldFillGrad)" 
          stroke="url(#shieldBorderGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Inner Shield Accent Line -->
    <path d="M 256 88 
             C 325 88, 390 104, 390 104 
             V 224 
             C 390 316, 316 382, 256 416 
             C 196 382, 122 316, 122 224 
             V 104 
             C 122 104, 187 88, 256 88 Z" 
          fill="none" 
          stroke="#60a5fa" 
          stroke-width="2" 
          stroke-opacity="0.3" />
  </g>

  <!-- Document Core Canvas (Foreground Layer) -->
  <g filter="url(#shadow)" transform="translate(166, 136)">
    <!-- Document Sheet Body -->
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 124 0 L 180 56 L 180 228 C 180 234.63, 174.63 240, 168 240 L 12 240 C 5.37 240, 0 234.63, 0 228 Z" fill="url(#docGrad)" />

    <!-- Folded Paper Corner -->
    <path d="M 124 0 L 180 56 L 136 56 C 129.37 56, 124 50.63, 124 44 Z" fill="#94a3b8" />

    <!-- Standard Text Lines (Un-redacted Data) -->
    <rect x="24" y="32" width="70" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <rect x="24" y="60" width="132" height="8" rx="4" fill="#94a3b8" opacity="0.7" />
    <rect x="24" y="164" width="100" height="8" rx="4" fill="#94a3b8" opacity="0.7" />
    <rect x="24" y="184" width="132" height="8" rx="4" fill="#94a3b8" opacity="0.7" />

    <!-- Active Redaction Bars (PII Masking Highlights) -->
    <!-- Redact Bar 1 (Sensitive NIK/Name Field) -->
    <rect x="20" y="86" width="140" height="22" rx="6" fill="#090d16" />
    <rect x="20" y="86" width="140" height="22" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" />
    <!-- Lock / Check Mark Accent on Redaction Bar 1 -->
    <circle cx="146" cy="97" r="6" fill="#3b82f6" />
    <path d="M 142.5 97 L 145 99.5 L 149.5 94.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Redact Bar 2 (Sensitive Phone/Face Field) -->
    <rect x="20" y="122" width="115" height="22" rx="6" fill="#090d16" />
    <rect x="20" y="122" width="115" height="22" rx="6" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2" />
  </g>

  <!-- Glowing Scanner Target Frame (Spatial OCR Overlay) -->
  <g filter="url(#glow)">
    <!-- Top-Left Corner Bracket -->
    <path d="M 152 148 L 132 148 C 123.16 148, 116 155.16, 116 164 L 116 184" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
    <!-- Top-Right Corner Bracket -->
    <path d="M 360 148 L 380 148 C 388.84 148, 396 155.16, 396 164 L 396 184" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
    <!-- Bottom-Left Corner Bracket -->
    <path d="M 116 328 L 116 348 C 116 356.84, 123.16 364, 132 364 L 152 364" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
    <!-- Bottom-Right Corner Bracket -->
    <path d="M 396 328 L 396 348 C 396 356.84, 388.84 364, 380 364 L 360 364" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
