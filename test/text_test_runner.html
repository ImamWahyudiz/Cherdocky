<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OCR & Sensitive Text Detection Test Suite</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; }
    .card { background: #1e293b; border-radius: 10px; padding: 20px; margin-bottom: 28px; border: 1px solid #334155; }
    .title { font-size: 18px; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .expected { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: 700; margin-bottom: 12px; margin-right: 8px; }
    .badge-success { background: #166534; color: #86efac; border: 1px solid #22c55e; }
    .badge-info { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
    .detected-list { background: #0f172a; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-bottom: 16px; max-height: 250px; overflow-y: auto; }
    .all-words-list { background: #090d16; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; margin-bottom: 16px; max-height: 200px; overflow-y: auto; color: #cbd5e1; }
    .detected-item { color: #f87171; font-weight: bold; margin-bottom: 4px; }
    canvas { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #475569; display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>OCR & Sensitive Text Detection Test Suite</h1>
  <div id="results">Menyiapkan pengujian OCR dan Deteksi Teks Sensitif...</div>

  <script type="module">
    import { processDocument } from '/src/utils/ocrEngine.ts';
    import { findContextualPIIWordIndices, extractFoundSensitiveKeywords, detectPII } from '/src/utils/piiDetector.ts';

    window.testResults = [];

    const testImages = [
      {
        name: 'NIK, Nama, Alamat dll, Tempat.jpeg',
        path: '/test/NIK,%20Nama,%20Alamat%20dll,%20Tempat.jpeg',
        expected: ['NIK', 'Nama', 'Alamat', 'Tempat / Tgl Lahir', 'RT/RW', 'Kel/Desa', 'Kecamatan', 'Agama', 'Status Perkawinan', 'Pekerjaan', 'Kewarganegaraan']
      },
      {
        name: 'IDn, DOB, no keyword address, DD.jpg',
        path: '/test/IDn,%20DOB,%20no%20keyword%20address,%20DD.jpg',
        expected: ['ID Number / DL Number', 'DOB / Date of Birth', 'Address (no keyword)', 'DD / Document Discriminator', 'Dates']
      },
      {
        name: 'content under keyword-Name, DoB, no keyword id.jpg',
        path: '/test/content%20under%20keyword-Name,%20DoB,%20no%20keyword%20id.jpg',
        expected: ['Name (value under keyword)', 'Date of Birth (value under keyword)', 'ID Number (no keyword)']
      },
      {
        name: 'content under keyword-surname, given name, number, date of birth.png',
        path: '/test/content%20under%20keyword-surname,%20given%20name,%20number,%20date%20of%20birth.png',
        expected: ['Surname (value under keyword)', 'Given Name (value under keyword)', 'Document Number (value under keyword)', 'Date of Birth (value under keyword)']
      }
    ];

    async function runSuite() {
      const container = document.getElementById('results');
      container.innerHTML = '';

      for (const t of testImages) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${t.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
        card.innerHTML = `
          <div class="title">${t.name}</div>
          <div class="expected"><strong>Ekspektasi Sensitif:</strong> ${t.expected.join(' · ')}</div>
          <div class="badge badge-info" id="status-${t.name.replace(/[^a-zA-Z0-9]/g, '_')}">Sedang OCR & Analisis...</div>
        `;
        container.appendChild(card);

        try {
          const resp = await fetch(t.path);
          const blob = await resp.blob();

          const words = await processDocument(blob, (p) => {
            const statusEl = document.getElementById(`status-${t.name.replace(/[^a-zA-Z0-9]/g, '_')}`);
            if (statusEl) statusEl.innerText = `OCR: ${Math.round(p * 100)}%`;
          });

          const activeTypes = ['nik', 'phone', 'email', 'id', 'bank', 'password', 'dob', 'ttl', 'bpjs', 'npwp'];
          const sensitiveIndices = findContextualPIIWordIndices(words, activeTypes);
          const foundKeywords = extractFoundSensitiveKeywords(words);

          window.testResults.push({
            name: t.name,
            words: words.map((w, i) => ({ index: i, text: w.text, x: w.x, y: w.y, w: w.width, h: w.height, isSensitive: sensitiveIndices.has(i) })),
            foundKeywords
          });

          const statusEl = document.getElementById(`status-${t.name.replace(/[^a-zA-Z0-9]/g, '_')}`);
          statusEl.className = 'badge badge-success';
          statusEl.innerText = `Total Kata: ${words.length} | Sensitif: ${sensitiveIndices.size} kata | Keyword Cocok: ${foundKeywords.length}`;

          // Detected words summary
          const listDiv = document.createElement('div');
          listDiv.className = 'detected-list';
          let listHtml = '<strong>Kata-kata Sensitif yang Terdeteksi:</strong><br>';
          const sensitiveWordsList = [];
          words.forEach((w, i) => {
            if (sensitiveIndices.has(i)) {
              sensitiveWordsList.push(`[#${i}] "${w.text}"`);
            }
          });
          listHtml += sensitiveWordsList.length > 0
            ? `<div class="detected-item">${sensitiveWordsList.join(', ')}</div>`
            : '<div class="normal-item">Tidak ada kata sensitif terdeteksi</div>';
          listDiv.innerHTML = listHtml;
          card.appendChild(listDiv);

          // All words list
          const allDiv = document.createElement('div');
          allDiv.className = 'all-words-list';
          allDiv.innerHTML = '<strong>Seluruh Teks Hasil OCR:</strong><br>' + words.map((w, i) => `[${i}] ${w.text} (x:${Math.round(w.x)}, y:${Math.round(w.y)}, w:${Math.round(w.width)}, h:${Math.round(w.height)})`).join('<br>');
          card.appendChild(allDiv);

          // Draw on Canvas
          const img = new Image();
          img.src = t.path;
          await new Promise(r => { img.onload = r; });

          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth || img.width;
          canvas.height = img.naturalHeight || img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          words.forEach((w, i) => {
            const isSens = sensitiveIndices.has(i);
            if (isSens) {
              ctx.strokeStyle = '#ef4444';
              ctx.lineWidth = Math.max(2, Math.round(canvas.width / 450));
              ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
              ctx.fillRect(w.x, w.y, w.width, w.height);
              ctx.strokeRect(w.x, w.y, w.width, w.height);
            } else {
              ctx.strokeStyle = 'rgba(34, 197, 94, 0.4)';
              ctx.lineWidth = 1;
              ctx.fillStyle = 'rgba(34, 197, 94, 0.08)';
              ctx.fillRect(w.x, w.y, w.width, w.height);
              ctx.strokeRect(w.x, w.y, w.width, w.height);
            }
          });

          card.appendChild(canvas);
        } catch (err) {
          console.error(`Error processing ${t.name}:`, err);
        }
      }
    }

    runSuite().catch(console.error);
  </script>
</body>
</html>
