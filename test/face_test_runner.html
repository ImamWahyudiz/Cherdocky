<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Detection Multi-Scale Grid Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; }
    .card { background: #1e293b; border-radius: 10px; padding: 20px; margin-bottom: 24px; border: 1px solid #334155; }
    .title { font-size: 16px; font-weight: 700; color: #e2e8f0; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .badge-success { background: #166534; color: #86efac; border: 1px solid #22c55e; }
    .badge-warn { background: #854d0e; color: #fef08a; border: 1px solid #eab308; }
    canvas { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #475569; display: block; }
  </style>
</head>
<body>
  <h1>Face Detection Verification Suite (Test Images)</h1>
  <div id="results">Memuat model dan menjalankan pengujian...</div>

  <script type="module">
    import { detectFaces } from '/src/utils/faceDetector.ts';

    const testImages = [
      { name: '12-photo-grid-sample.jpg', expected: 12, path: '/test/12-photo-grid-sample.jpg' },
      { name: '15-photo-grid.jpg', expected: 15, path: '/test/15-photo-grid.jpg' },
      { name: '15-photo-grid-with-3-rows-and-5-columns.jpg', expected: 15, path: '/test/15-photo-grid-with-3-rows-and-5-columns.jpg' },
      { name: '15-photo-grid-with-3-rows-and-5-columns (1).jpg', expected: 15, path: '/test/15-photo-grid-with-3-rows-and-5-columns%20(1).jpg' },
    ];

    async function runSuite() {
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = '';

      for (const t of testImages) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="title">${t.name} (Target: ~${t.expected} wajah)</div><div class="badge badge-warn" id="status-${t.name.replace(/[^a-zA-Z0-9]/g, '_')}">Memproses...</div>`;
        resultsContainer.appendChild(card);

        const img = new Image();
        img.src = t.path;
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('Failed to load image: ' + t.path));
        });

        console.time(t.name);
        const detections = await detectFaces(img, (status) => {
          console.log(`[${t.name}] ${status}`);
        });
        console.timeEnd(t.name);

        const statusBadge = document.getElementById(`status-${t.name.replace(/[^a-zA-Z0-9]/g, '_')}`);
        const count = detections.length;
        statusBadge.className = count >= t.expected - 2 ? 'badge badge-success' : 'badge badge-warn';
        statusBadge.innerText = `Terdeteksi: ${count} wajah (Target: ${t.expected})`;

        // Draw image and bounding boxes on canvas
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        ctx.lineWidth = Math.max(2, Math.round(canvas.width / 400));
        ctx.strokeStyle = '#ef4444';
        ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';

        detections.forEach((box, i) => {
          ctx.fillRect(box.x, box.y, box.w, box.h);
          ctx.strokeRect(box.x, box.y, box.w, box.h);

          // Draw label
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(box.x, Math.max(0, box.y - 18), 24, 18);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(`${i + 1}`, box.x + 4, Math.max(14, box.y - 4));
          ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
        });

        card.appendChild(canvas);
      }
    }

    runSuite().catch((err) => {
      document.getElementById('results').innerHTML = `<div style="color:#ef4444;">Error running test suite: ${err.message}</div>`;
      console.error(err);
    });
  </script>
</body>
</html>
